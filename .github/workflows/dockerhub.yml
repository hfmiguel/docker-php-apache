name: Docker PHP CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
  DOCKER_HUB_IMAGE_FPM_NAME: php-8.5-fpm
  DOCKER_HUB_IMAGE_APACHE_NAME: php-8.5-apache
  DOCKER_HUB_IMAGE_COMPOSER_NAME: php-8.5-composer
  DOCKER_HUB_IMAGE_OPENCODE_NAME: opencode-v1
  DOCKER_HUB_NAMESPACE: ${{ secrets.DOCKER_HUB_NAMESPACE }}
  GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

jobs:
  guardian:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history so multiple commits can be scanned

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1.25.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ env.GITGUARDIAN_API_KEY }}

  build-and-push-php-apache-docker-hub:
    name: Push Docker image to Docker Hub
    needs: guardian
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract APACHE metadata (tags, labels) for Docker
        id: meta-apache
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_APACHE_NAME }}

      - name: Build and push Docker Apache image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.apache
          push: true
          tags: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_APACHE_NAME }}
          labels: ${{ steps.meta-apache.outputs.labels }}

  build-and-push-php-fpm-docker-hub:
    name: Push Docker image to Docker Hub
    needs: guardian
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract FPM metadata (tags, labels) for Docker
        id: meta-fpm
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_FPM_NAME }}

      - name: Build and push Docker FPM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.fpm
          push: true
          tags: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_FPM_NAME }}
          labels: ${{ steps.meta-fpm.outputs.labels }}

  build-and-push-php-composer-docker-hub:
    name: Push Docker image to Docker Hub
    needs: guardian
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract Composer metadata (tags, labels) for Docker
        id: meta-composer
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_COMPOSER_NAME }}

      - name: Build and push Docker Composer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.phpcomposer
          push: true
          tags: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_COMPOSER_NAME }}
          labels: ${{ steps.meta-composer.outputs.labels }}

  build-and-push-opencode-docker-hub:
    name: Push Docker OpenCode image to Docker Hub
    needs: guardian
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract OpenCode metadata (tags, labels) for Docker
        id: meta-opencode
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_OPENCODE_NAME }}

      - name: Build and push Docker OpenCode image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.opencode
          push: true
          tags: ${{ env.DOCKER_HUB_NAMESPACE }}/${{ env.DOCKER_HUB_IMAGE_OPENCODE_NAME }}
          labels: ${{ steps.meta-opencode.outputs.labels }}

  create_release:
    name: Create Release
    needs:
      [
        "guardian",
        "build-and-push-php-apache-docker-hub",
        "build-and-push-php-fpm-docker-hub",
        "build-and-push-php-composer-docker-hub",
        "build-and-push-opencode-docker-hub",
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Generate release tag
        id: generate_release_tag
        uses: amitsingh-007/next-release-tag@v5.0.0
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          tag_prefix: "v"
          tag_template: "yyyy.mm.dd.i"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.generate_release_tag.outputs.next_release_tag }}
          release_name: Release ${{ steps.generate_release_tag.outputs.next_release_tag }}
          draft: false
          prerelease: false

      - uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}